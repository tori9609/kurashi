# 暮らし帳:supabase/functions を上げたら、Edge Functions(push・receipt-read)を自動で置き直す(Verify JWT はオフのまま)
name: Edge Functionsを反映
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch: {}
concurrency: { group: kurashi-functions, cancel-in-progress: false }
jobs:
  functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: '${{ secrets.SUPABASE_ACCESS_TOKEN }}'
      PROJECT_REF: '${{ secrets.SUPABASE_PROJECT_REF }}'
    steps:
      - uses: actions/checkout@v4
      - name: 一括チェック(不合格なら、ここで止めて反映しない)
        run: node tools/check.mjs
      - name: 準備ができているか
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then echo "::error::GitHub の Secrets に SUPABASE_ACCESS_TOKEN と SUPABASE_PROJECT_REF が要ります(手順書の「自動で反映する準備」)"; exit 1; fi
      - uses: supabase/setup-cli@v2
        with: { version: latest }
      - name: push を置き直す
        run: supabase functions deploy push --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes
      - name: receipt-read を置き直す
        run: supabase functions deploy receipt-read --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes
